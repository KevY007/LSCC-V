<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css"
        integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/stye.css">
    <title>LS-CC</title>
</head>
<table class="align-middle text-center testa" style="height: 100vh; width: 100vw;">
    <tbody>
        <tr>
            <td>
                <div class="text-center custom01">
                    <img src="./assets/img/logo.png" class="img-fluid mx-auto row" alt="LS-CC logo">
                    <form class="">
                        <div class="row">
                            <div class="col mr-3">
                                <label for="inputEmail4" class="custom-text">USERNAME</label>
                                <input type="text" class="form-control custom-input" id="usernameText">
                            </div>
                            <div class="col">
                                <label for="inputPassword4" class="custom-text">E-MAIL</label>
                                <input type="email" class="form-control custom-input" id="emailText">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col mr-3">
                                <label for="inputEmail4" class="custom-text">PASSWORD</label>
                                <input type="password" class="form-control custom-input" id="passwordText">
                            </div>
                            <div class="col">
                                <label for="inputPassword4" class="custom-text">CONFIRM PASSWORD</label>
                                <input type="password" class="form-control custom-input" id="passwordTextConfirm">
                            </div>
                        </div>
                        <div class="text-center">
                            <button type="submit" class="btn btn-primary sign-in-button" id="registerButton">SIGN UP</button>
                        </div>
                    </form>
                    <p class="text-white mt-2">Already have an account? <a href="./login.html">Login</a></p>
                </div>
            </td>
        </tr>
    </tbody>
</table>


<body>

    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.js"
        integrity="sha256-QWo7LDvxbWT2tbbQ97B53yJnYU3WhH/C8ycbRAkjPDc=" crossorigin="anonymous">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
        integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous">
    </script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"
        integrity="sha384-OgVRvuATP1z7JjHLkuOU7Xw704+h835Lr+6QL9UvYjZE3Ipu6Tp75j7Bh/kR0JKI" crossorigin="anonymous">
    </script>
    <script src="loginregister.js" type="text/javascript"></script>
</body>

</html>
