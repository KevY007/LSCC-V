<!doctype html>

<head>

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/main.css">
        
    <script src="scripts/bootstrap/jquery-3.3.1.slim.min.js"></script>
    <script src="scripts/bootstrap/popper.min.js"></script>
    <script src="scripts/bootstrap/bootstrap.min.js"></script>
    
</head>

<html lang="en">

    <body>

        <center>

            <div class="card" style="width:25rem; margin:20px 0 24px 0">

                <img class="card-img-top grey-card" src="images/banner.png" alt="image" style="width:100%">
                
                <!--<hr>-->
                
                <div class="card-body grey-card">

                    <!--<div class="form-group">
                        <label for="email">Email address:</label>
                        <input type="email" class="form-control" id="email">
                    </div>-->

                    <form>

                        <div class="input-group mb-3">
                                <div class="input-group-prepend">
                                    <span class="input-group-text">~</span>
                                </div>
                            <input id="registerUsernameText" type="text" class="form-control" placeholder="Username">
                        </div>

                        <div class="input-group mb-3">
                            <div class="input-group-prepend">
                                    <span class="input-group-text">@</span>
                            </div>
                            <input id="registerEmailText" type="text" class="form-control" placeholder="Email">
                        </div>

                        <div class="input-group mb-3">
                                <div class="input-group-prepend">
                                    <span class="input-group-text">#</span>
                                </div>
                                <input id="registerPasswordText" type="text" class="form-control" placeholder="Password">
                        </div>

                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="rules">
                            <label class="form-check-label" for="rules">I agree to <a href="#">LSCC's Rules & Regulations</a>.</label>
                        </div>

                        <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="allcorrect">
                                <label class="form-check-label" for="rules">All of the information above is correct.</label>
                            </div>

                        <br>

                    </form>

                    <button id="registerButton" type="submit" class="btn btn-primary btn-block">Register</button>

                    <br>

                    <a href="login.html">Already have an account?</a>

                </div>
            </div>
			
        </center>
		<script src="loginregister.js" type="text/javascript"></script>
    </body>

</html>
