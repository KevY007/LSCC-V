<!doctype html>

<html lang="en">

    <head>

        <link rel="stylesheet" href="css/bootstrap.min.css">
        <link rel="stylesheet" href="css/main.css">
        
        <script src="scripts/bootstrap/jquery-3.3.1.slim.min.js"></script>
        <script src="scripts/bootstrap/popper.min.js"></script>
        <script src="scripts/bootstrap/bootstrap.min.js"></script>
    
    </head>

    <body>

        <center>

            <div class="card text-center" style="width:25rem; margin:20px 0 24px 0;">

                <img class="card-img-top grey-card" src="images/banner.png" alt="image" style="width:100%">
                
                <!--<hr>-->
                
                <div class="card-body grey-card">

                    <!--<div class="form-group">
                        <label for="email">Email address:</label>
                        <input type="email" class="form-control" id="email">
                    </div>-->

                    <form>

                        <div class="input-group mb-3">
                            <div class="input-group-prepend">
                                    <span class="input-group-text">@</span>
                            </div>
                            <input id="loginEmailText" type="text" class="form-control" placeholder="Email/Username">
                        </div>

                        <div class="input-group mb-3">
                                <div class="input-group-prepend">
                                    <span class="input-group-text">#</span>
                                </div>
                                <input id="loginPasswordText" type="password" class="form-control" placeholder="Password">
                        </div>

                    </form>

                    <p style="text-align:right"><a href="#">Forgot password?</a></p>

                    <button id="loginButton" type="button" class="btn btn-primary btn-block">Login</button>

                    <br>

                    <a href="register.html">Don't have an account?</a>
                    
                </div>
            </div>

        </center>
		<script src="loginregister.js" type="text/javascript"></script>
    </body>

</html>
