<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTfAAsrekwKmP1" crossorigin="anonymous">


    <link rel="stylesheet" href="style.css">

    <title>KevY GAY</title>
</head>

<body>
    <!--<button style="position: absolute; top: 10;"
        onclick="addCar('Kosatka', '15', './images/car_images/kosatka.png', 1, false)">addCar</button>-->
    <div class="card card-custom">
        <div class="card-header text-center">
            Car Selection<button type="button" onclick="mp.events.call('hideCarSelector')" class="btn-close" aria-label="Close"></button>
            <br>
            <ul class="nav nav-pills justify-content-center mt-1" id="pills-tab" role="tablist">
                <li class="nav-item" role="presentation">
                    <a class="nav-link cop-navlink cop-navlink-active active" id="loadout-police-tab"
                        data-bs-toggle="pill" href="#loadout-police" role="tab" aria-controls="loadout-police"
                        aria-selected="true">Police</a>
                </li>
                <li class="nav-item" role="presentation">
                    <a class="nav-link fugitive-navlink" id="loadout-fugitive-tab" data-bs-toggle="pill"
                        href="#loadout-fugitive" role="tab" aria-controls="loadout-fugitive"
                        aria-selected="false">Fugitive</a>
                </li>
            </ul>
        </div>
        <div class="card-body my-custom-scrollbar" style="padding: 0px;">
            <div class="tab-content" id="pills-tabContent">
                <div class="tab-pane fade show active" id="loadout-police" role="tabpanel"
                    aria-labelledby="loadout-police-tab">
                    <div class="container-custom">
                        <div class="row" id="police-shere" style="min-width: 990.59px;">
                        </div>
                    </div>
                </div>
                <div class="tab-pane fade" id="loadout-fugitive" role="tabpanel" aria-labelledby="loadout-fugitive-tab">
                    <div class="container-custom">
                        <div class="row" id="fugitive-shere">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="card-footer">
        </div>
    </div>
    <script>
        function addCar(Name, Level, carImage, Team, Locked) {

            //Main card
            let card = document.createElement("div");
            card.classList.add("card", "custom-card");

            //Card header
            let card_header = document.createElement("div");
            card_header.classList.add("card-header", "text-center")
            let card_header_text = document.createTextNode(Name);
            card_header.appendChild(card_header_text);

            //Badge
            //let level_badge = document.createElement("span");
            //level_badge.classList.add("badge", "rounded-pill", "bg-secondary", "custom-badge");
            //let level_badge_text = document.createTextNode(Level);
            //level_badge.appendChild(level_badge_text);
            //card_header.appendChild(level_badge);

            //Car Image
            let imgElement = document.createElement("img");
            imgElement.src = carImage;
            imgElement.setAttribute("class", "card-img-top");
            card.appendChild(imgElement);

            card.appendChild(card_header);

            //Card footer
            let card_footer = document.createElement("div");
            card_footer.classList.add("card-footer", "text-center");
            let card_desc = document.createElement("p");
            card_desc.classList.add("loadout_desc");
            let equipStr = `This car requires level ${Level} to be equipped.`;

            if (Level == 0) equipStr = `This car has no level requirement to equip.`;
            let card_desc_text = document.createTextNode(equipStr);
            card_desc.appendChild(card_desc_text);
            card_footer.appendChild(card_desc);
            //Equip button
            let equip_button = document.createElement("button");
            let equip_button_text = document.createTextNode("Equip");
            equip_button.appendChild(equip_button_text);

            if (Locked === true) {
                equip_button.disabled = true;
                equip_button.classList.add("btn", "equip-btn-locked");
            } else {
                equip_button.classList.add("btn", "equip-btn");
                equip_button.onclick = function () {
                    mp.events.call("OnSelectCar", Team, Name);
                };
            }
            card_footer.appendChild(equip_button);

            card.appendChild(card_footer);

            if (Team == 1) {
                document.getElementById("police-shere").appendChild(card);
            } else if (Team == 0) {
                document.getElementById("fugitive-shere").appendChild(card);
            }

        }
    </script>

    <!-- Optional JavaScript; choose one of the two! -->

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ygbV9kiqUc6oa4msXn9868pTtWMgiQaeYH7/t7LECLbyPA2x65Kgf80OJFdroafW" crossorigin="anonymous">
    </script>

    <!-- Option 2: Separate Popper and Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"
        integrity="sha384-q2kxQ16AaE6UbzuKqyBE9/u/KzioAlnx2maXQHiDX9d4/zp8Ok3f+M7DPm+Ib6IU" crossorigin="anonymous">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.min.js"
        integrity="sha384-pQQkAEnwaBkjpqZ8RU1fF1AKtTcHJwFl3pblpTlHXybJjHpMYo79HY3hIi4NKxyj" crossorigin="anonymous">
    </script>
    <script src="https://code.jquery.com/jquery-3.5.1.js"
        integrity="sha256-QWo7LDvxbWT2tbbQ97B53yJnYU3WhH/C8ycbRAkjPDc=" crossorigin="anonymous"></script>

    <!-- Button Style JS -->
    <script>
        $(".cop-navlink").click(function () {
            $(".cop-navlink").removeClass("cop-navlink-active");
            $(".fugitive-navlink").removeClass(
                "fugitive-navlink-active");
            $(this).addClass("cop-navlink-active");
            return false;
        })

        $(".fugitive-navlink").click(function () {
            $(".fugitive-navlink").removeClass(
                "fugitive-navlink-active");
            $(".cop-navlink").removeClass("cop-navlink-active");
            $(this).addClass(
                "fugitive-navlink-active");
            return false;
        })
    </script>

</body>

</html>
