<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTfAAsrekwKmP1" crossorigin="anonymous">

    <title>Progress bar</title>
</head>

<body>
    <div class="progress mx-auto fixed-bottom custom-progress" id="custom-progressbarex" style="height: 35px; width: 30rem;">
        <div class="progress-bar bg-danger progress-bar-striped progress-bar-animated" role="progressbar"
            aria-valuenow="75" aria-valuemin="0" aria-valuemax="100" style="width: 0%" id="custom-progressbar"></div>
    </div>

    <script>
        function setProgress(percent) {
            document.getElementById("custom-progressbar").style.width = `${percent}%`;

            if(percent <= 0)
            {
                document.getElementById("custom-progressbarex").style.visibility = "hidden";
            }
            else {
                document.getElementById("custom-progressbarex").style.visibility = "visible";
            }
        }

        setProgress(10);

        function getProgress() {
            return document.getElementById("custom-progressbar").style.width;
        }
    </script>

    <style>
        * {
            user-select: none;
        }

        body {
            background: rgba(0, 0, 0, 0);
        }

        .custom-progress {
            margin-bottom: 5rem;
            border-radius: 5px;
            box-shadow: 0 0 2rem 0 rgba(0, 0, 0, .2);
        }
    </style>

    <!-- Optional JavaScript; choose one of the two! -->

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ygbV9kiqUc6oa4msXn9868pTtWMgiQaeYH7/t7LECLbyPA2x65Kgf80OJFdroafW" crossorigin="anonymous">
    </script>

    <!-- Option 2: Separate Popper and Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js" integrity="sha384-q2kxQ16AaE6UbzuKqyBE9/u/KzioAlnx2maXQHiDX9d4/zp8Ok3f+M7DPm+Ib6IU" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.min.js" integrity="sha384-pQQkAEnwaBkjpqZ8RU1fF1AKtTcHJwFl3pblpTlHXybJjHpMYo79HY3hIi4NKxyj" crossorigin="anonymous"></script>
    -->
</body>

</html>
