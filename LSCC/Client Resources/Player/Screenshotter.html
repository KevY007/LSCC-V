<html>
<head>
</head>
<body>
<img src="">
<form id="postForm" method="POST" action="" enctype="multipart/form-data">
		<input id="uploader" type="file" name ="uploader"> 
		<input id="uploadersubmit" type="submit" value = "Upload">
</form>
</body>
<script>
document.getElementById("uploader").hidden = true;
document.getElementById("uploadersubmit").hidden = true;

// loadImage("today-23-512;53;125_2015.png", "screenshot.png", "Screenshotter35125_3512", "null", "http://127.0.0.1/imguploader.php")
function loadImage(name, url, event, identifier, uploadUrl)
{
	document.getElementById("postForm").action = `${uploadUrl}?event=${event}&id=${identifier}`;
	toDataUrl(url, (data) => {
		let file = new File([dataURItoBlob(data)], name, 
			{ type: "image/png", lastModified: new Date().getTime() } );
		
		let container = new DataTransfer();
		
		container.items.add(file);
		document.getElementById("uploader").files = container.files;
		
		document.getElementById("uploadersubmit").click()
	});
}

function toDataUrl(url, callback) {
    
    var xhr = new XMLHttpRequest();
    xhr.onload = function() {
        var reader = new FileReader();
        reader.onloadend = function() {
            callback(reader.result);
        }
        reader.readAsDataURL(xhr.response);
    };

    
    xhr.open('GET', url);
    xhr.responseType = 'blob';
    xhr.send();
}


function dataURItoBlob(dataURI) {
  // convert base64 to raw binary data held in a string
  // doesn't handle URLEncoded DataURIs - see SO answer #6850276 for code that does this
  var byteString = atob(dataURI.split(',')[1]);

  // separate out the mime component
  var mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0]

  // write the bytes of the string to an ArrayBuffer
  var ab = new ArrayBuffer(byteString.length);

  // create a view into the buffer
  var ia = new Uint8Array(ab);

  // set the bytes of the buffer to the correct values
  for (var i = 0; i < byteString.length; i++) {
      ia[i] = byteString.charCodeAt(i);
  }

  // write the ArrayBuffer to a blob, and you're done
  var blob = new Blob([ab], {type: mimeString});
  return blob;
}

</script>
</html>
