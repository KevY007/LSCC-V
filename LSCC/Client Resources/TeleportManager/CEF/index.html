            </div>                
        </div>

                    <div class="teleport-editor" id="teleport_editor">
                        <div class="tips-holder">
                            <p>Press <strong>F2</strong> to toggle the cursor.</p>
                            <p>You can click on any option name to see what it does.</p>
                            <p>If this is your first time using the TP Manager, <strong>read every option's description</strong>!</p>
                        </div>
                        <div class="editor-top">
                            <button id="teleport_finish_create_button">Create [TP Name]</button>
                        </div>
                        <div class="editor-positions">
                            <h1>Position</h1>
                            <div class="editor-position">
                                <h3 onclick="onRequestHelp(0)">From:</h3>
                                <button id="set_from_position">Set</button>
                                <p>X,Y,Z,H</p>
                            </div>
                            <div class="editor-position">
                                <h3 onclick="onRequestHelp(1)">To:</h3>
                                <button id="set_to_position">Set</button>
                                <p>X,Y,Z,H</p>
                            </div>
                        </div>
                        <div class="editor-generic-row">
                            <div style="width:34%;"><h3 onclick="onRequestHelp(2)">Blip:</h3></div>
                            <div style="width:33%;"><input id="blip_id" type="number" placeholder="Blip ID"/></div>
                            <div style="width:33%;"><button onclick="toggleBlipList(true)">Show Blip List</button></div>
                        </div>
                        <div class="editor-generic-row">
                            <div style="width:34%;"><h3 onclick="onRequestHelp(3)">Side Entrance:</h3></div>
                            <div style="width:33%;"><input id="side_entrance_id" type="number" placeholder="Teleport ID"/></div>
                            <div style="width:33%;"><button>Teleport List</button></div>
                        </div>
                        <div class="editor-generic-row">
                            <div style="width:34%;"><h3 onclick="onRequestHelp(4)">Dimension:</h3></div>
                            <div style="width:33%;"><button id="dim_outside_button" style="background-color:white; color:black;">Outside</button></div>
                            <div style="width:33%;"><button id="dim_inside_button">Inside</button></div>
                        </div>
                        <div class="editor-generic-row">
                            <div style="width:34%;"><h3 onclick="onRequestHelp(5)">Freeze Time:</h3></div>
                            <div style="width:33%;"><input id="freeze_time" type="number" placeholder="Milliseconds"/></div>
                            <div style="width:33%;"></div>
                        </div>
                        <div class="editor-generic-row">
                            <div style="width:34%;"><h3 onclick="onRequestHelp(6)">IPLs</h3></div>
                            <div style="width:33%;"><input id="ipl_name_input" type="text" placeholder="IPL name"/></div>
                            <div style="width:33%;"><button id="ipl_name_add">Add</button></div>
                        </div>
                        <div class="ipl-list">
                            <p class="ipl-list-header">IPL List</p>
                            <div class="ipl-list-items" id="ipl_items_list">
                                <!-- <div class="ipl-item">
                                    <p>test_ipl_bro</p>
                                    <button>Remove</button>
                                </div> -->
                            </div>
                        </div>
                    </div>
                </div>
