        <script>
            setInterval(() => {
                let datetime = new Date();
                let timeToDisplay = (datetime.getHours() >= 10 ? datetime.getHours() : `0${datetime.getHours()}`);
                let minToDisplay = (datetime.getMinutes() >= 10 ? datetime.getMinutes() : `0${datetime.getMinutes()}`);
                document.getElementById("taskbar_time").innerHTML = timeToDisplay + ":" + minToDisplay;
                document.getElementById("taskbar_date").innerHTML = `${datetime.getDate()}.${datetime.getMonth()+1}.${datetime.getFullYear()}`;
            }, 1000);
